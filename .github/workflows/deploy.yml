name: Deploy Mern-Stack App

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and Push Code Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/mern-stack-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.HOST_DNS}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.EC2_SSH_KEY}}
          script: |
            # Phải nằm thụt lề vào trong script như thế này
            docker pull ${{secrets.DOCKER_USERNAME}}/mern-stack-app:latest
            docker stop mern-app-container || true
            docker rm mern-app-container || true
            docker run -dp 4000:4000 --name mern-app-container -e MONGO_PASSWORD='${{secrets.MONGO_PASSWORD}}' -e CONNECTION_STRING="${{secrets.CONNECTION_STRING}}" ${{secrets.DOCKER_USERNAME}}/mern-stack-app:latest

