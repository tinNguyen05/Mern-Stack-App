name: Deploy Mern-Stack App

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and Push Code Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/mern-stack-app:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull Image from Docker Hub
        run: docker pull ${{secrets.DOCKER_USERNAME}}/mern-stack-app:latest

      - name: Stop and Remove Old Container
        run: |
          docker stop mern-app-container || true
          docker rm mern-app-container || true

      - name: Run Docker Container
        run: docker run -dp 4000:4000 --name mern-app-container -e MONGO_PASSWORD='${{secrets.MONGO_PASSWORD}}' ${{secrets.DOCKER_USERNAME}}/mern-stack-app:latest

